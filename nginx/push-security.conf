# Push endpoint hardening snippet for nginx.
# Use this as a template and adapt upstream names / cert paths to your environment.
#
# IMPORTANT:
# - This snippet assumes TLS termination is already configured.
# - Apply inside the main nginx config (http{} and server{} scopes as noted).

# http {} scope
map $http_x_push_token_hash $push_rate_key {
    default $binary_remote_addr;
    "~^[A-Fa-f0-9]{64}$" $http_x_push_token_hash;
}

limit_req_zone $push_rate_key zone=push_mutations:20m rate=30r/m;

# server {} scope
location ~ ^/v1/push/(register|update|unregister|challenge)$ {
    client_max_body_size 64k;
    limit_req zone=push_mutations burst=10 nodelay;
    limit_except POST PUT DELETE { deny all; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://kasia_indexer_upstream;
}

# Block deprecated unversioned push routes.
location ^~ /push/ {
    return 404;
}
